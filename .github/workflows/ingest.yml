name: Ingest

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Max batches per run (0 = time-budget only)'
        default: '0'
      time_budget:
        description: 'Time budget in minutes'
        default: '270'

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache/anime-atlas.sqlite
          key: sqlite-${{ github.run_number }}
          restore-keys: |
            sqlite-

      - name: Install dependencies
        run: npm ci

      - name: Run batched ingest
        env:
          TIME_BUDGET_MINUTES: ${{ github.event.inputs.time_budget || '270' }}
          # 0 = unlimited batches, rely purely on time budget
          RUN_BATCH_LIMIT: ${{ github.event.inputs.batch_limit || '0' }}
          # 90 req/min hard cap → 1.5/s max. Run at 80% = 1.2/s.
          # Adaptive slowdown kicks in automatically via X-RateLimit-Remaining.
          REQUESTS_PER_SECOND: '1.2'
          BATCH_MAX_RETRIES: '5'
        run: npm run ingest:batched

      - name: Build artifacts
        env:
          DATA_DIR: ${{ github.workspace }}/data
          # GitHub Actions runners have ~7 GB RAM. The default Node heap is 4 GB
          # which is too small for UMAP on 18k+ media + 38k people. Set to 6 GB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build:artifacts

      - name: Sanity check artifacts
        env:
          DATA_DIR: ${{ github.workspace }}/data
        run: npm run sanity:artifacts

      - name: Commit and push artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update ingest artifacts"
          git pull --rebase origin main
          git push
