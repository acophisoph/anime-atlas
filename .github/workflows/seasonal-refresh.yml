name: Seasonal Refresh

# Runs at the start of each anime season quarter and can be triggered manually.
# Updates season_current.json with pedigree data for the new season, then deploys.
on:
  schedule:
    # Season start dates (UTC midnight): Jan 1 (Winter), Apr 1 (Spring), Jul 1 (Summer), Oct 1 (Fall)
    - cron: '0 2 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to build (WINTER/SPRING/SUMMER/FALL, default: auto)'
        default: ''
      season_year:
        description: 'Year for the season (default: current year)'
        default: ''

concurrency:
  group: seasonal-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-season:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache/anime-atlas.sqlite
          key: sqlite-latest
          restore-keys: |
            sqlite-

      - name: Install dependencies
        run: npm ci

      - name: Build season_current.json
        env:
          DATA_DIR: ${{ github.workspace }}/data
          DB_PATH:  ${{ github.workspace }}/scripts/.cache/anime-atlas.sqlite
          SEASON:       ${{ github.event.inputs.season }}
          SEASON_YEAR:  ${{ github.event.inputs.season_year }}
        run: node scripts/commands/build-season.js

      - name: Commit and push season data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index/season_current.json
          git diff --staged --quiet && echo "No changes to season_current.json" && exit 0
          git commit -m "chore: update season_current.json for $(date +'%Y-%m')"
          git pull --rebase origin main
          git push

  # Trigger a fresh deploy after season data is committed
  trigger-deploy:
    needs: build-season
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
